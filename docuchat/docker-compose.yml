services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docuchat
      POSTGRES_PASSWORD: docuchat
      POSTGRES_DB: docuchat
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuchat"]
      interval: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://docuchat:docuchat@db:5432/docuchat
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [chroma:/data/chroma]
volumes:
  pgdata:
  chroma:
